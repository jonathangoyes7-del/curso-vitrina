<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrina</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<main>
  <h1>Vitrina</h1>
  <form id="subida">
    <div id="zona">
      <p><strong>Arrastra aquí una o varias fotos</strong> o elígelas con el botón.</p>
      <input type="file" name="foto" accept="image/*,.heic" multiple required aria-label="Fotos de las piezas">
      <button>Subir fotos</button>
    </div>
  </form>
  <ul id="resultados" role="status" aria-live="polite"></ul>
  <p id="aviso" role="alert"></p>
  <div id="sin-conexion" role="alert" hidden>
    <p><strong>El panel no responde.</strong> <span id="sin-conexion-detalle">Comprueba que la ventana de Vitrina sigue abierta; si la cerraste, abre otra vez <code>iniciar.ps1</code>. Lo que ves abajo puede estar desactualizado.</span> <span id="reintento" role="status"></span></p>
    <button type="button" id="reconectar">Reintentar</button>
  </div>
  <p id="conexion">Conectando…</p>
  <section id="revision" aria-live="polite" hidden></section>
  <div id="lista"><p class="estado-lista" id="cargando">Cargando tus piezas…</p></div>
</main>
<script src="panel.js"></script>
</body>
</html>
