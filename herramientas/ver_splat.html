<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Visor de splats (herramienta del pico)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #F5F1E8; overflow: hidden; }
  canvas { display: block; }
  #msg { position: fixed; left: 8px; top: 8px; font: 12px monospace; color: #2E2D2B; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/",
    "@sparkjsdev/spark": "/node_modules/@sparkjsdev/spark/dist/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="msg">cargando…</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

// ?splat=RUTA  [&q=x,y,z,w  rotación del splat]  [&cam=x,y,z  posición]  [&target=x,y,z]
const p = new URLSearchParams(location.search);
const nums = (s, d) => (s ? s.split(",").map(Number) : d);
const url = p.get("splat");
const msg = document.getElementById("msg");

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 100);
camera.position.set(...nums(p.get("cam"), [0, 0, 2.5]));
const spark = new SparkRenderer({ renderer });
scene.add(spark);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...nums(p.get("target"), [0, 0, 0]));
controls.enableDamping = true;
controls.update();

const splat = new SplatMesh({ url });
splat.quaternion.set(...nums(p.get("q"), [0, 0, 0, 1]));
scene.add(splat);
splat.initialized.then(() => {
  const box = splat.getBoundingBox ? splat.getBoundingBox() : null;
  msg.textContent = "listo" + (box ? ` bbox ${box.min.toArray().map((v) => v.toFixed(2))} → ${box.max.toArray().map((v) => v.toFixed(2))}` : "");
  document.title += " [listo]";
}).catch((e) => { msg.textContent = "error: " + e; });

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});
</script>
</body>
</html>
